[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "blackref"
version = "0.2.0"
description = "An uncompromising BibTeX/BibLaTeX reference list formatter."
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [
    { name = "David Völgyes", email = "david.volgyes@ieee.org" }
]
keywords = ["code formatting", "latex", "bibtex", "biblatex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "bibtexparser~=1.4.4",
    "click~=8.2",
    "httpx2~=2.3",
    "isbnlib~=3.10.14",
    "loguru~=0.7.3",
    "pylatexenc~=2.10",
]

[project.urls]
Homepage = "https://github.com/dvolgyes/blackref"
Repository = "https://github.com/dvolgyes/blackref"
Issues = "https://github.com/dvolgyes/blackref/issues"

[project.scripts]
blackref = "blackref.__init__:main"

[tool.uv.build-backend]
module-root = ""
source-include = ["LICENSE.txt", "tests/**"]

[dependency-groups]
dev = [
    "coverage>=7.9.1,<8",
    "coveralls~=4.1",
    "pytest~=8.4",
    "pytest-cov~=6.2",
    "pytest-xdist~=3.8",
]
